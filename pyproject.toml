[project]
name = "fm-fewshot"
version = "1.00"
description = "Flow matching as a layer: few-shot classification over frozen encoder features"
readme = "README.md"
authors = [{ name = "Eyal Shtinmetz", email = "eyalshtinmetz@gmail.com" }]
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fm_fewshot"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=fm_fewshot --cov-report=term-missing"

[tool.coverage.run]
source = ["fm_fewshot"]
omit = ["*/__main__.py"]

[tool.coverage.report]
fail_under = 85
