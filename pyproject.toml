[project]
name = "fm-fewshot"
version = "1.00"
description = "Flow matching as a layer: few-shot classification over frozen encoder features"
readme = "README.md"
authors = [{ name = "Eyal Shtinmetz", email = "eyalshtinmetz@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.1",
    "scikit-learn>=1.5",
    "timm>=1.0",
    "pyyaml>=6.0",
    "torch>=2.7",
    "torchvision>=0.22",
]

# Platform-resolved torch (PLAN, Technology): the CPU-only laptop is Windows and
# pulls the CPU wheel from the PyTorch index; Linux pulls an explicit CUDA 12.8
# build. PyPI's default Linux wheels moved to a CUDA 13 runtime, which requires an
# r580 or newer driver; the GPU box runs 565.90, capped at CUDA 12.7, where a cu130
# wheel reports no device and jobs fall back to CPU. One lockfile serves both.
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cpu", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fm_fewshot"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=fm_fewshot --cov-report=term-missing"
markers = [
    "slow: needs manually acquired data or long runtimes; skips or runs out of the default gate",
]

[tool.coverage.run]
source = ["fm_fewshot"]
omit = ["*/__main__.py"]

[tool.coverage.report]
fail_under = 85
