# Stage 3, Strategy 1 (end-to-end rolled-out cross-entropy), expanded by
# services/evaluation/sweep.py.
#
# Same datasets, encoders, K and seeds as stage1.yaml, because the write-up
# requires the Stage 3 rows to be directly comparable with the linear-probe
# baseline they are reported against. The seed count per cell comes from the
# protocol, not from this file.
#
# The grid is a superset of what he asked for (ADR-029). He narrows Stage 3 to
# one encoder per dataset, one K and one T "to keep this stage focused"; the
# cells he named are the Main Comparison, (dtd, resnet18, K=10) and
# (fgvc_aircraft, dinov2_vits14, K=10), and they are designated in the note
# rather than obtained by omitting the rest. A different K or T is a different
# cell and never merges into one of his.
#
# Two variants, not two heads: T in {4, 12}. Here T is the depth of the network
# being trained, as it is for fm_rolled, because the loss is backpropagated
# through all T velocity predictions (ADR-032). Which T the Main Comparison
# reports is chosen on mean validation top-1 across the two main cells, by the
# rule written down before this grid runs, with T=4 breaking a tie.

datasets:
  - dtd
  - fgvc_aircraft

encoders:
  resnet18:
    - dtd
    - fgvc_aircraft
  dinov2_vits14:
    - fgvc_aircraft

ks:
  - 5
  - 10
  - full

# The training choices held fixed across the comparison, per the write-up's
# fairness requirement. Every value here appears identically in
# stage3_guided.yaml; if one moves, both move.
variants:
  - label: T4
    head: fm_prelinear_ce
    head_params: &stage3_training
      sample_steps: 4
      n_train_steps: 2000
      batch_size: 64
      lr: 1.0e-3
      hidden_dims: [512, 512]
      time_conditioning: scalar
      # Checkpoint selection on validation accuracy, every 50 steps, approved
      # as a protocol-level rule after Stage 2 (ADR-028).
      eval_every: 50
      # The untrained system is the linear probe exactly (ADR-030).
      zero_output_init: true
      # The write-up's Strategy 1 is the plain cross-entropy. Both penalties
      # are his optional extras and sweep in stage3_ablations.yaml (ADR-034);
      # a graded row carries neither.
      lambda_disp: 0.0
      lambda_vel: 0.0
      # Ours, not his, and an ablation only (stage3_alignment 3.3).
      project_velocity: false
  - label: T12
    head: fm_prelinear_ce
    head_params:
      <<: *stage3_training
      sample_steps: 12
