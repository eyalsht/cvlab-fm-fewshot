# Figure configuration, shared by the Stage 1 families F1 to F4, the Stage 2
# families S1 to S7 and the Stage 3 families P1 to P4.
#
# viz_classes is fixed per dataset and never varies between encoders: the
# write-up requires the same classes, the same test examples and the same class
# colors whenever encoders or methods are compared on one dataset. Colors are
# derived from the sorted class list (figures.class_colors), so pinning the
# list here pins the colors too, and Stage 2 and Stage 3 read the same list so a
# class keeps its color across all three stages.

# Both write-ups say "PCA or t-SNE may be used", so both are drawn rather than
# one chosen. PCA is a linear map every point passes through identically and the
# only one with a preimage, which is what lets P3 overlay the frozen probe's
# decision regions; t-SNE separates structure two linear axes cannot hold. The
# PCA figures keep the bare filename, t-SNE ones take a _tsne suffix.
projections: [pca, tsne]
viz_seed: 0
max_per_class: 60
dpi: 200

# Stage 2. The representative cell S2, S3 and S4 are drawn from: one setting,
# stated here rather than chosen per figure, so the training curve, the feature
# comparison and the trajectories all describe the same fitted field.
stage2:
  representative_k: 10          # 10-shot, as the write-up's training-curve item asks
  representative_subset_seed: 0
  t_values: [4, 12]             # the two step counts the write-up evaluates
  feature_t: 4                  # the T at which S3 compares the two schemes
  trajectory_classes: 3         # S4 stays readable only at a few classes
  trajectory_per_class: 2

# Stage 3. Same idea and the same reason: P2's curves, P3's feature panels and
# P4's displacement panels all describe one fitted field per strategy, so the
# setting is stated once here rather than chosen per figure.
stage3:
  representative_k: 10
  representative_subset_seed: 0
  t_values: [4, 12]             # the two step counts the Stage 3 grid runs
  # His Stage 3 write-up: "Choose a single number of Euler steps T and use it
  # throughout Stage 3". The grid runs both, the prose is written at T=12, so the
  # panels are drawn there too. Stage 2 stays at 4: its write-up evaluates both
  # step counts and its prose is written for the shorter solve.
  feature_t: 12                 # the T at which P3 and P4 compare the two strategies
  # The Main Comparison's encoder per dataset, the cells he narrowed Stage 3 to
  # (ADR-029). P1 marks that cell on the panel rather than drawing it separately,
  # so the required comparison and the extended grid are one picture.
  main_encoder:
    dtd: resnet18
    fgvc_aircraft: dinov2_vits14

datasets:
  dtd:
    # Visually distinct textures, spread across the alphabet rather than
    # clustered, so the plot is not dominated by near-synonyms.
    viz_classes:
      - banded
      - bubbly
      - chequered
      - cobwebbed
      - cracked
      - honeycombed
      - marbled
      - striped
      - swirly
      - zigzagged
    confusion_setting:
      encoder: resnet18
      head: linear_probe
      k: full

  fgvc_aircraft:
    # One variant per manufacturer family where possible, so confusions in the
    # plot are between genuinely different aircraft rather than between two
    # trims of the same airframe.
    viz_classes:
      - 707-320
      - 737-800
      - 747-400
      - A320
      - ATR-72
      - BAE 146-300
      - Cessna 172
      - DC-9-30
      - E-195
      - Spitfire
    confusion_setting:
      encoder: dinov2_vits14
      head: linear_probe
      k: full
