# Stage 3 ablations (G8). Run into ablations/, never results/:
#
#   uv run python -m fm_fewshot sweep --config config/stage3_ablations.yaml \
#       --results-dir ablations
#
# report is never pointed at ablations/, which is what keeps these out of the
# graded cells. Everything here is something the write-up invited rather than
# specified ("you may also experiment with", "whether the target updates should
# be normalized or otherwise constrained"), plus the two schemes proposed under
# his licence clause, so by ADR-016's rule none of it is a graded row.
#
# Scoped to the two Main Comparison cells, (dtd, resnet18) and
# (fgvc_aircraft, dinov2_vits14) at K=10, because these answer questions about
# the graded rows rather than extending the grid.
#
# T is 12: the value 10.8's pre-registered rule chose for the Main Comparison,
# so each ablation is read against the graded row it questions rather than
# against a different depth. The rule chose it by 0.0026 on validation, a
# margin smaller than any cell's seed spread, so nothing here rests on T.

datasets:
  - dtd
  - fgvc_aircraft

encoders:
  resnet18:
    - dtd
  dinov2_vits14:
    - fgvc_aircraft

ks:
  - 10

variants:
  # ADR-034: the two penalties he names, against the graded lambda = 0 row.
  - label: ce-disp0.01
    head: fm_prelinear_ce
    head_params: &stage3_training
      sample_steps: 12
      n_train_steps: 2000
      batch_size: 64
      lr: 1.0e-3
      hidden_dims: [512, 512]
      time_conditioning: scalar
      eval_every: 50
      zero_output_init: true
      lambda_disp: 0.01
      lambda_vel: 0.0
      project_velocity: false
  - label: ce-disp0.1
    head: fm_prelinear_ce
    head_params:
      <<: *stage3_training
      lambda_disp: 0.1
  - label: ce-vel0.01
    head: fm_prelinear_ce
    head_params:
      <<: *stage3_training
      lambda_disp: 0.0
      lambda_vel: 0.01
  - label: ce-vel0.1
    head: fm_prelinear_ce
    head_params:
      <<: *stage3_training
      lambda_disp: 0.0
      lambda_vel: 0.1
  # stage3_alignment 3.3: the control that puts Strategy 1 in Strategy 2's
  # search space while keeping its objective. If it closes the gap, the
  # difference between his two strategies is the constraint and not the loss.
  - label: ce-rowspace
    head: fm_prelinear_ce
    head_params:
      <<: *stage3_training
      project_velocity: true
  # ADR-033: his own open question, answered with numbers rather than assumed.
  # The graded row is the unconstrained step; these bound it two ways.
  - label: guided-norm-rho0.25
    head: fm_prelinear_guided
    head_params:
      sample_steps: 12
      n_train_steps: 2000
      batch_size: 64
      lr: 1.0e-3
      hidden_dims: [512, 512]
      time_conditioning: scalar
      eval_every: 50
      zero_output_init: true
      target_step: normalized
      eta: 1.0
      target_steps: 1
      target_every: 1
      rho: 0.25
  # The cap sweep continues below 0.25 because the first pass found the gain
  # rising as the cap tightened, and rho -> 0 must return to the probe exactly
  # (the target collapses onto z and the field onto identity), so there is an
  # interior optimum to locate rather than a monotone trend to follow.
  - label: guided-norm-rho0.1
    head: fm_prelinear_guided
    head_params:
      sample_steps: 12
      n_train_steps: 2000
      batch_size: 64
      lr: 1.0e-3
      hidden_dims: [512, 512]
      time_conditioning: scalar
      eval_every: 50
      zero_output_init: true
      target_step: normalized
      eta: 1.0
      target_steps: 1
      target_every: 1
      rho: 0.1
  - label: guided-norm-rho0.15
    head: fm_prelinear_guided
    head_params:
      sample_steps: 12
      n_train_steps: 2000
      batch_size: 64
      lr: 1.0e-3
      hidden_dims: [512, 512]
      time_conditioning: scalar
      eval_every: 50
      zero_output_init: true
      target_step: normalized
      eta: 1.0
      target_steps: 1
      target_every: 1
      rho: 0.15
  - label: guided-norm-rho0.5
    head: fm_prelinear_guided
    head_params:
      sample_steps: 12
      n_train_steps: 2000
      batch_size: 64
      lr: 1.0e-3
      hidden_dims: [512, 512]
      time_conditioning: scalar
      eval_every: 50
      zero_output_init: true
      target_step: normalized
      eta: 1.0
      target_steps: 1
      target_every: 1
      rho: 0.5
  # The cheaper, staler recompute he also allows, and a larger step, so the
  # drift the graded row may show is measured against something.
  - label: guided-raw-every50
    head: fm_prelinear_guided
    head_params:
      sample_steps: 12
      n_train_steps: 2000
      batch_size: 64
      lr: 1.0e-3
      hidden_dims: [512, 512]
      time_conditioning: scalar
      eval_every: 50
      zero_output_init: true
      target_step: raw
      eta: 1.0
      target_steps: 1
      target_every: 50
  - label: guided-raw-m3
    head: fm_prelinear_guided
    head_params:
      sample_steps: 12
      n_train_steps: 2000
      batch_size: 64
      lr: 1.0e-3
      hidden_dims: [512, 512]
      time_conditioning: scalar
      eval_every: 50
      zero_output_init: true
      target_step: raw
      eta: 1.0
      target_steps: 3
      target_every: 1
  # His write-up names four things to experiment with for Strategy 2. The two
  # below were the ones still unswept: the feature-space step size and the
  # number of target-improvement steps. Both are swept on the uncapped
  # configuration, because under `normalized` the gradient is rescaled to
  # ||z|| before the eta multiply and then clipped at rho ||z||, so with one
  # target step any eta at or above rho gives the identical capped target and
  # eta is inert there. guided-norm-rho0.25-eta2 is the pair that checks that
  # claim against a run rather than leaving it an argument.
  # The write-up's other two open knobs, "the feature-space step size" and
  # "the number of target-improvement steps" (eta and target_steps), still
  # unswept above. Both must run under target_step: raw, not normalized.
  # classifier_guided.py rescales the gradient to || z || before the eta
  # multiply (guided_target, the `gradient / (... ) * anchor` line) and then,
  # only under `normalized`, clips the whole step to `rho || z ||` in `_cap`.
  # With target_steps: 1 and the near-identity start, the pre-cap step has
  # norm ~= eta || z ||, so once eta >= rho the cap always fires and every
  # such eta lands on the identical clipped target: eta is inert there. raw
  # never clips, so it is where eta's own size is what is being measured.
  # Same base as the graded row throughout: raw, eta 1.0, target_steps 1,
  # target_every 1; one knob moves per variant.
  - label: guided-raw-eta0.1
    head: fm_prelinear_guided
    head_params: &stage3_guided
      sample_steps: 12
      n_train_steps: 2000
      batch_size: 64
      lr: 1.0e-3
      hidden_dims: [512, 512]
      time_conditioning: scalar
      eval_every: 50
      zero_output_init: true
      target_step: raw
      eta: 0.1
      target_steps: 1
      target_every: 1
  - label: guided-raw-eta0.25
    head: fm_prelinear_guided
    head_params:
      <<: *stage3_guided
      eta: 0.25
  - label: guided-raw-eta0.5
    head: fm_prelinear_guided
    head_params:
      <<: *stage3_guided
      eta: 0.5
  - label: guided-raw-eta2
    head: fm_prelinear_guided
    head_params:
      <<: *stage3_guided
      eta: 2.0
  - label: guided-raw-eta4
    head: fm_prelinear_guided
    head_params:
      <<: *stage3_guided
      eta: 4.0
  # target_steps at the graded eta, uncapped, so each added step is a full
  # unclipped move rather than one that collapses into the same cap
  # (guided-raw-m3 above already covers target_steps: 3 at this base).
  # target_steps at the graded eta, uncapped, so each added step is a full
  # unclipped move rather than one that collapses into the same cap
  # (guided-raw-m3 above already covers target_steps: 3 at this base).
  - label: guided-raw-m2
    head: fm_prelinear_guided
    head_params:
      <<: *stage3_guided
      eta: 1.0
      target_steps: 2
  - label: guided-raw-m5
    head: fm_prelinear_guided
    head_params:
      <<: *stage3_guided
      eta: 1.0
      target_steps: 5
  - label: guided-raw-m10
    head: fm_prelinear_guided
    head_params:
      <<: *stage3_guided
      eta: 1.0
      target_steps: 10
  # Direct check of the cap-inertness reading above: same rho as
  # guided-norm-rho0.25 but eta doubled. If the reading is right this
  # reproduces guided-norm-rho0.25 to within seed noise despite the
  # different eta, because both hit the same cap.
  # Direct check of the cap-inertness reading above: same rho as
  # guided-norm-rho0.25 but eta doubled. If the reading is right this
  # reproduces guided-norm-rho0.25 to within seed noise despite the
  # different eta, because both hit the same cap.
  - label: guided-norm-rho0.25-eta2
    head: fm_prelinear_guided
    head_params:
      sample_steps: 12
      n_train_steps: 2000
      batch_size: 64
      lr: 1.0e-3
      hidden_dims: [512, 512]
      time_conditioning: scalar
      eval_every: 50
      zero_output_init: true
      target_step: normalized
      eta: 2.0
      target_steps: 1
      target_every: 1
      rho: 0.25
