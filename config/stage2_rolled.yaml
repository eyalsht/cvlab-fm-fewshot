# Stage 2, rolled-out training, expanded by services/evaluation/sweep.py.
#
# Same datasets, encoders, K and seeds as stage1.yaml, because the write-up
# requires the FM rows to be directly comparable with their Stage 1 baseline.
# The seed count per cell still comes from the protocol, not from this file.
#
# Two variants, not two heads: the write-up evaluates T in {4, 12}, and one
# head at two step counts has to reach the table as two rows. Here the two are
# genuinely two models: rolled-out training backpropagates through all T steps
# and the write-up requires the same T at training and inference, so T is the
# depth of the network being trained (ADR-022). The T=4 to T=12 gap therefore
# measures capacity here and curvature in stage2_standard.yaml, and the phase
# note must not report them as one axis.

datasets:
  - dtd
  - fgvc_aircraft

encoders:
  resnet18:
    - dtd
    - fgvc_aircraft
  dinov2_vits14:
    - fgvc_aircraft

ks:
  - 5
  - 10
  - full

# The training choices the write-up says to hold fixed when comparing the two
# schemes. Every value here appears identically in stage2_standard.yaml; if one
# moves, both move.
variants:
  - label: T4
    head: fm_rolled
    head_params: &stage2_training
      sample_steps: 4
      n_train_steps: 2000
      batch_size: 64
      lr: 1.0e-3
      hidden_dims: [512, 512]
      time_conditioning: scalar
      # Checkpoint selection on validation accuracy, every 50 steps (ADR-028).
      # 0 restores the fixed-schedule behaviour that kept the final field.
      eval_every: 50
  - label: T12
    head: fm_rolled
    head_params:
      <<: *stage2_training
      sample_steps: 12
